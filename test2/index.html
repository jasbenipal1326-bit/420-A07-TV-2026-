<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo Dashboard</title>

    <style>

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #f4f6f8;

            color: #333;

        }

        header {

            background-color: #2563eb;

            color: white;

            padding: 25px;

            text-align: center;

        }

        main {

            max-width: 1000px;

            margin: auto;

            padding: 20px;

        }

        #count {

            text-align: center;

            font-size: 20px;

            font-weight: bold;

        }

        #status {

            text-align: center;

            padding: 10px;

        }

        #todo-list {

            display: grid;

            grid-template-columns: 1fr;

            gap: 15px;

        }

        .card {

            background-color: white;

            padding: 20px;

            border-radius: 10px;

            border-left: 5px solid #2563eb;

            box-shadow: 0 2px 5px #00000015;

        }

        .card h2 {

            font-size: 17px;

            margin-top: 0;

        }

        .completed {

            color: green;

            border-left-color: green;

        }

        footer {

            text-align: center;

            padding: 20px;

            color: #666;

        }

        @media (min-width: 768px) {

            #todo-list {

                grid-template-columns: repeat(2, 1fr);

            }

        }

    </style>

</head>

<body>

    <header>

        <h1>Todo Dashboard</h1>

        <p>View your daily tasks</p>

    </header>

    <main>

        <p id="count" aria-live="polite"></p>

        <p id="status" role="status">Loading…</p>

        <section id="todo-list" aria-label="Todo items"></section>

    </main>

    <footer>

        <p>420-A07-TV-2026 | Test 1</p>

    </footer>

    <script>

        const todoList = document.getElementById("todo-list");

        const status = document.getElementById("status");

        const count = document.getElementById("count");

        async function loadTodos() {

            status.textContent = "Loading…";

            try {

                const response = await fetch(

                    "https://jsonplaceholder.typicode.com/todos?_limit=12"

                );

                if (!response.ok) {

                    throw new Error("Unable to load todos");

                }

                const todos = await response.json();

                todoList.innerHTML = "";

                const completedCount = todos.filter(

                    todo => todo.completed

                ).length;

                count.textContent =

                    `${completedCount} of ${todos.length} completed`;

                todos.forEach(todo => {

                    const card = document.createElement("article");

                    card.classList.add("card");

                    if (todo.completed) {

                        card.classList.add("completed");

                    }

                    const title = document.createElement("h2");

                    title.textContent = todo.title;

                    const taskStatus = document.createElement("p");

                    taskStatus.textContent = todo.completed

                        ? "✅ Completed"

                        : "⬜ Not completed";

                    card.appendChild(title);

                    card.appendChild(taskStatus);

                    todoList.appendChild(card);

                });

                status.textContent = "";

            } catch (error) {

                status.textContent =

                    "Sorry, we could not load your tasks. Please try again later.";

                count.textContent = "";

            }

        }

        loadTodos();

    </script>

</body>

</html>
